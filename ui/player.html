<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Non Stop Pop DJ player</title>
<style>
  body { margin: 24px; background: #111; color: #bbb; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  b { color: #fff; }
</style>
</head>
<body>
<!-- Non Stop Pop DJ's built-in player. The app keeps this window off-screen (never hidden: a hidden page loads no sound); it plays your music through Spotify's own
     Web Playback SDK, and closes itself when the app goes away. -->
<b>Non Stop Pop DJ</b>
<div id="status">Starting the player…</div>
<script>
  'use strict';
  const params = new URLSearchParams(location.search);
  const key = encodeURIComponent(params.get('k') || '');
  const launch = encodeURIComponent(params.get('n') || '');      // which start of the player this page belongs to
  const tries = +(params.get('try') || 0);
  const say = text => { document.getElementById('status').textContent = text; };
  const post = (type, data = {}) => fetch(`/event?k=${key}&n=${launch}`, { method: 'POST', body: JSON.stringify({ type, ...data }) }).catch(() => {});
  let player = null, misses = 0, readyAt = 0;
  // songs taken out of the queue in the app: skipped the moment they start (Spotify has no "remove from queue" for apps)
  let skip = new Set(), lastUri = '';
  window.__setSkip = list => { skip = new Set(Array.isArray(list) ? list : []); return skip.size; };

  async function token() {
    for (let i = 0; i < 4; i++) {
      try {
        const j = await (await fetch(`/token?k=${key}`)).json();
        if (j.token) return j.token;
      } catch (e) { /* the app is busy; try again */ }
      await new Promise(r => setTimeout(r, 1500));
    }
    return '';
  }

  // The first time, the browser downloads Widevine (Spotify's copy protection) in the background, so wait and reload.
  function retry(why) {
    say(`${why} Trying again in a moment…`);
    if (tries >= 6) { post('init_gave_up', { message: why }); return; }
    setTimeout(() => { const u = new URL(location.href); u.searchParams.set('try', String(tries + 1)); location.replace(u.toString()); }, 15000);
  }

  window.onSpotifyWebPlaybackSDKReady = () => {
    player = new Spotify.Player({ name: 'Non Stop Pop DJ', getOAuthToken: cb => { token().then(cb); }, volume: 1.0 });
    player.addListener('ready', ({ device_id }) => { readyAt = Date.now(); say('Ready'); post('ready', { device_id }); });
    player.addListener('not_ready', ({ device_id }) => { say('Reconnecting…'); post('not_ready', { device_id }); });
    player.addListener('initialization_error', ({ message }) => { post('error', { kind: 'init', message }); retry(message); });
    player.addListener('authentication_error', ({ message }) => { say(message); post('error', { kind: 'auth', message }); });
    player.addListener('account_error', ({ message }) => { say(message); post('error', { kind: 'account', message }); });
    player.addListener('playback_error', ({ message }) => { post('error', { kind: 'playback', message }); });
    player.addListener('autoplay_failed', () => { post('autoplay'); });
    player.addListener('player_state_changed', st => {
      const t = st && st.track_window && st.track_window.current_track;
      media(st, t);
      report(st);
      if (!t || t.uri === lastUri) return;
      lastUri = t.uri;
      const hit = [t.uri, t.linked_from && t.linked_from.uri].find(u => u && skip.has(u));
      if (hit && st.position < 6000) { skip.delete(hit); player.nextTrack().catch(() => {}); post('skipped', { uri: hit }); }
    });
    player.connect().then(ok => { if (!ok) post('log', { message: 'the player could not connect to Spotify' }); });
  };

  // What's playing, for the app. While the music plays here the app reads the song, where it's at and whether it's
  // paused from this page, instead of asking Spotify's servers every few seconds (Spotify counts every request).
  const tr = x => x ? ({ uri: x.uri || '', id: x.id || (x.uri || '').split(':').pop(), type: x.type || 'track', name: x.name || '',
    duration_ms: x.duration_ms || 0, linked: (x.linked_from && x.linked_from.uri) || '',
    artists: (x.artists || []).map(a => ({ name: a.name || '', uri: a.uri || '', id: (a.uri || '').split(':').pop() })),
    album: x.album ? { name: x.album.name || '', uri: x.album.uri || '', id: (x.album.uri || '').split(':').pop(), images: x.album.images || [] } : null }) : null;
  async function report(st) {
    if (!player || !readyAt) return;
    if (st === undefined) st = await player.getCurrentState().catch(() => null);
    const t = st && st.track_window && st.track_window.current_track;
    let volume = null;
    try { volume = Math.round((await player.getVolume()) * 100); } catch (e) { /* not yet */ }
    post('state', t ? { paused: !!st.paused, position: st.position || 0, duration: st.duration || t.duration_ms || 0, shuffle: !!st.shuffle,
      repeat: st.repeat_mode || 0, context: (st.context && st.context.uri) || '',
      contextName: (st.context && st.context.metadata && st.context.metadata.name) || '', track: tr(t), volume } : { none: true, volume });
  }
  setInterval(() => report(), 5000);       // and every few seconds anyway, so the app knows this page is still the one playing

  // Windows' media controls (keyboard media keys, the volume flyout, a tablet's buttons). Chrome hands them to the
  // top-most frame that plays sound. The music plays inside Spotify's own frame, which only answers play and pause,
  // so this page plays a loop of silence (which makes it the one Chrome asks) and answers next and previous too.
  let quiet = null, shown = '';
  function silence() {
    const n = 4000, b = new ArrayBuffer(44 + n), v = new DataView(b), w = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
    for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
    const a = new Audio(URL.createObjectURL(new Blob([b], { type: 'audio/wav' })));
    a.loop = true;
    return a;
  }
  function media(st, t) {
    const ms = navigator.mediaSession;
    if (!ms || !player) return;
    if (!quiet) {
      quiet = silence();
      const act = (name, fn) => { try { ms.setActionHandler(name, fn); } catch (e) { /* not on this browser */ } };
      act('play', () => player.resume()); act('pause', () => player.pause());
      act('nexttrack', () => player.nextTrack()); act('previoustrack', () => player.previousTrack());
      act('seekto', d => player.seek(Math.max(0, Math.round((d.seekTime || 0) * 1000))));
    }
    const playing = !!(st && t && !st.paused);
    if (playing && quiet.paused) quiet.play().catch(() => {});
    if (!playing && !quiet.paused) quiet.pause();
    ms.playbackState = !st || !t ? 'none' : playing ? 'playing' : 'paused';
    if (t && t.uri !== shown && window.MediaMetadata) {
      shown = t.uri;
      const art = ((t.album && t.album.images) || []).slice().sort((x, y) => (y.width || 0) - (x.width || 0));
      ms.metadata = new MediaMetadata({ title: t.name || '', artist: (t.artists || []).map(a => a.name).join(', '), album: (t.album && t.album.name) || '',
        artwork: art.map(i => ({ src: i.url, sizes: i.width ? `${i.width}x${i.height || i.width}` : '640x640', type: 'image/jpeg' })) });
    }
  }

  // The app calls this as if you'd clicked in this page (browsers only let sound start after a click), then nudges
  // playback so the sound really starts.
  window.__unlock = async () => {
    if (!player) return 'no player yet';
    try { await player.activateElement(); } catch (e) { /* older SDKs don't need it */ }
    const st = await player.getCurrentState().catch(() => null);
    if (st && !st.paused) {
      await player.pause().catch(() => {});
      await new Promise(r => setTimeout(r, 300));
      await player.resume().catch(() => {});
      return 'playing again';
    }
    return st ? 'ready (paused)' : 'ready';
  };

  // The app's play/pause/skip buttons, straight to the player (each gives up after 4 seconds rather than hang)
  window.__ctl = async (action, value) => {
    if (!player) return 'no player';
    const within = p => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('the player took too long')), 4000))]);
    try { await player.activateElement(); } catch (e) { /* not needed everywhere */ }
    const n = Number(value) || 0;
    const run = {
      toggle: () => player.togglePlay(), play: () => player.resume(), pause: () => player.pause(),
      next: () => player.nextTrack(), previous: () => player.previousTrack(),
      seek: () => player.seek(Math.max(0, Math.round(n))), volume: () => player.setVolume(Math.max(0, Math.min(1, n / 100))),
    }[action];
    if (!run) return 'unknown';
    await within(run());
    const st = await within(player.getCurrentState()).catch(() => null);
    report(st || undefined);
    return st ? (st.paused ? 'paused' : 'playing') : 'ok';
  };

  // a hidden page loads no sound (the browser waits until it's looked at), so say whenever that changes
  document.addEventListener('visibilitychange', () => post('log', { message: `the player page is now ${document.visibilityState}` }));

  // what this browser can do, for the app's Activity log
  (async () => {
    const d = {};
    try {
      await navigator.requestMediaKeySystemAccess('com.widevine.alpha', [{ initDataTypes: ['cenc'],
        audioCapabilities: [{ contentType: 'audio/mp4;codecs="mp4a.40.2"' }] }]);
      d.widevine = 'ok';
    } catch (e) { d.widevine = `missing (${e.name})`; }
    try { const ac = new AudioContext(); d.sound = ac.state; ac.close(); } catch (e) { d.sound = `error (${e.name})`; }
    d.browser = (navigator.userAgent.match(/Edg\/[\d.]+|Chrome\/[\d.]+/) || ['?'])[0];
    d.page = document.visibilityState;
    post('diag', d);
  })();

  // no SDK after a minute (offline, or blocked)? reload and try again
  setTimeout(() => { if (!player) retry("Couldn't reach Spotify."); }, 60000);

  // check in with the app every few seconds: if it's gone or wants the player off, disconnect and close
  setInterval(async () => {
    try {
      const j = await (await fetch(`/ping?k=${key}&n=${launch}&vis=${document.visibilityState}`)).json();
      misses = 0;
      if (Array.isArray(j.skip)) window.__setSkip(j.skip);
      if (j.stop) { if (player) player.disconnect(); player = null; window.close(); }
    } catch (e) {
      if (++misses >= 3) { if (player) player.disconnect(); player = null; window.close(); }
    }
  }, 3000);
</script>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>
</html>
