<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Non Stop Pop DJ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="ambient"><div class="layer"></div><div class="layer"></div></div>

<aside id="sidebar">
  <div class="brand" data-act="tab" data-tab="home" title="Home">
    <div class="tile"><span id="brand-bars" class="bars"></span></div>
    <div class="ell"><b>Non Stop Pop</b><small><span id="brand-dot" class="dot"></span><span id="brand-status" class="ell">Off air</span></small></div>
  </div>
  <nav class="nav">
    <button data-act="tab" data-tab="home"><i data-icon="home" data-size="22"></i>Home</button>
    <button data-act="tab" data-tab="cara"><i data-icon="radio" data-size="22"></i>Cara</button>
    <button data-act="tab" data-tab="library"><i data-icon="library" data-size="22"></i>Your Library</button>
    <button data-act="tab" data-tab="search"><i data-icon="search" data-size="22"></i>Search</button>
  </nav>
  <div class="side-label"><span class="caps">Playlists</span><button data-act="new-playlist" title="New playlist"><i data-icon="plus" data-size="18"></i></button></div>
  <div class="side-list scroll" id="side-list"></div>
  <div class="account">
    <button class="me" data-act="settings" title="Settings"><div class="avatar" id="me-avatar"></div><span class="ell" id="me-name">Settings</span></button>
    <button class="icon-btn" data-act="settings" title="Settings"><i data-icon="settings" data-size="20"></i></button>
  </div>
</aside>

<main id="main">
  <div id="topbar">
    <button class="round" id="nav-back" data-act="back" title="Back (Alt+Left)"><i data-icon="back" data-size="22"></i></button>
    <button class="round" id="nav-fwd" data-act="forward" title="Forward (Alt+Right)"><i data-icon="forward" data-size="22"></i></button>
    <span class="title"></span>
    <span class="spacer"></span>
  </div>
  <div id="scroller" class="scroll"><div id="page"></div></div>
</main>

<footer id="bar">
  <div class="now">
    <div class="art" id="bar-art" title="Open the big player"></div>
    <div class="names"><b id="bar-title" class="ell">Not connected</b><small id="bar-artist" class="ell"></small></div>
    <button class="icon-btn" id="bar-like" title="Add to Liked Songs" hidden></button>
  </div>
  <div class="transport">
    <div class="buttons">
      <button class="icon-btn" id="bar-shuffle" title="Shuffle"><i data-icon="shuffle" data-size="20"></i></button>
      <button class="icon-btn" id="bar-prev" title="Previous (Ctrl+Left)"><i data-icon="prev" data-size="22"></i></button>
      <button class="play-btn" id="bar-play" title="Play / Pause (Space)"></button>
      <button class="icon-btn" id="bar-next" title="Next (Ctrl+Right)"><i data-icon="next" data-size="22"></i></button>
      <button class="icon-btn" id="bar-repeat" title="Repeat"></button>
    </div>
    <div class="progress">
      <span id="bar-pos" class="num">0:00</span>
      <div class="track-bar" id="bar-seek"><div class="rail"><div class="fill" id="bar-fill"></div></div><div class="knob" id="bar-knob"></div></div>
      <span id="bar-dur" class="num">0:00</span>
    </div>
  </div>
  <div class="side">
    <button class="dj-btn" id="dj-btn"></button>
    <button class="icon-btn" id="bar-vis" title="Visualizer (V)"><i data-icon="sparkles" data-size="20"></i></button>
    <button class="icon-btn" id="bar-lyrics" title="Lyrics"><i data-icon="quote" data-size="20"></i></button>
    <button class="icon-btn" id="bar-queue" title="Up next"><i data-icon="queue" data-size="20"></i></button>
    <button class="icon-btn" id="bar-dev" title="Devices"><i data-icon="speaker" data-size="20"></i></button>
    <button class="icon-btn" id="bar-sleep" title="Sleep timer"><i data-icon="moon" data-size="19"></i></button>
    <div class="vol"><button class="icon-btn" id="bar-mute" title="Mute"></button><input type="range" id="bar-vol" min="0" max="100" value="60" title="Spotify volume"></div>
    <button class="icon-btn" id="bar-expand" title="Big player"><i data-icon="expand" data-size="18"></i></button>
  </div>
</footer>

<div id="np">
  <div class="np-bg" id="np-bg"></div>
  <div class="np-top">
    <button class="round" id="np-close" title="Close (Esc)"><i data-icon="down" data-size="24"></i></button>
    <span class="caps ell" id="np-from">Now playing</span>
    <div class="np-top-btns">
      <button class="round" id="np-vis" title="Visualizer (V)"><i data-icon="sparkles" data-size="20"></i></button>
      <button class="round" id="np-sleep" title="Sleep timer"><i data-icon="moon" data-size="19"></i></button>
      <button class="round" id="np-more" title="More"><i data-icon="more" data-size="20"></i></button>
    </div>
  </div>
  <div class="col left">
    <div class="cover-wrap"><div id="np-art"></div><div class="caption" id="np-caption"></div></div>
    <div class="song">
      <div class="ell"><h1 id="np-title" class="ell">Nothing playing</h1><p id="np-artist" class="ell"></p></div>
      <div class="btns"><button class="icon-btn" id="np-like" title="Like"></button></div>
    </div>
    <div class="np-progress">
      <div class="track-bar" id="np-seek"><div class="rail"><div class="fill" id="np-fill"></div></div><div class="knob" id="np-knob"></div></div>
      <div class="times num"><span id="np-pos">0:00</span><span id="np-dur">-0:00</span></div>
    </div>
    <div class="np-controls">
      <button class="icon-btn" id="np-shuffle" title="Shuffle"><i data-icon="shuffle" data-size="24"></i></button>
      <button class="icon-btn" id="np-prev" title="Previous"><i data-icon="prev" data-size="34"></i></button>
      <button class="play-btn" id="np-play" title="Play / Pause"></button>
      <button class="icon-btn" id="np-next" title="Next"><i data-icon="next" data-size="34"></i></button>
      <button class="icon-btn" id="np-repeat" title="Repeat"></button>
    </div>
    <div class="np-foot"><button class="np-device" id="np-device"></button><button class="icon-btn" id="np-dj" title="Go live"><i data-icon="radio" data-size="24"></i></button></div>
  </div>
  <div class="col right">
    <div class="tabs"><button class="chip" data-tab="lyrics">Lyrics</button><button class="chip" data-tab="queue">Up Next</button><button class="chip" data-tab="about">About</button></div>
    <div class="panel scroll" id="np-panel"></div>
  </div>
</div>

<div id="toast"></div>

<script src="icons.js"></script>
<script>document.querySelectorAll('[data-icon]').forEach(el => { el.outerHTML = icon(el.dataset.icon, +(el.dataset.size || 20)); });</script>
<script src="vis.js"></script>
<script src="app.js"></script>
</body>
</html>
